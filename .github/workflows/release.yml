name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            suffix: linux-amd64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            suffix: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Build joob-server
        run: cargo build --release -p joob-server

      - name: Build joob-client
        run: cargo build --release -p joob-client

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp target/release/joob-server dist/joob-server-${{ matrix.suffix }}
          cp target/release/joob-client dist/joob-client-${{ matrix.suffix }}
          chmod +x dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.suffix }}
          path: dist/

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build joob-client (Windows)
        run: cargo build --release -p joob-client

      - name: Build joob-gui (Windows)
        run: cargo build --release -p joob-gui

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/joob-client.exe dist/joob-client-windows-amd64.exe
          cp target/release/joob.exe dist/joob-windows-amd64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: dist/

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/joob-server-linux-amd64
            dist/joob-server-linux-arm64
            dist/joob-client-linux-amd64
            dist/joob-client-linux-arm64
            dist/joob-client-windows-amd64.exe
            dist/joob-windows-amd64.exe
            dist/SHA256SUMS
