name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
            suffix: linux-amd64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-22.04
            suffix: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        run: |
          sudo apt-get update
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            sudo apt-get install -y musl-tools
          else
            sudo apt-get install -y gcc-aarch64-linux-gnu musl-tools
            # Install aarch64 musl cross-compiler
            sudo apt-get install -y wget
            wget -q https://musl.cc/aarch64-linux-musl-cross.tgz
            tar xzf aarch64-linux-musl-cross.tgz
            echo "$PWD/aarch64-linux-musl-cross/bin" >> $GITHUB_PATH
          fi

      - name: Configure cross-compilation
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          mkdir -p .cargo
          printf '[target.aarch64-unknown-linux-musl]\nlinker = "aarch64-linux-musl-gcc"\n' >> .cargo/config.toml

      - name: Build joob-server
        run: cargo build --release -p joob-server --target ${{ matrix.target }}

      - name: Build joob-client
        run: cargo build --release -p joob-client --target ${{ matrix.target }}

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/joob-server dist/joob-server-${{ matrix.suffix }}
          cp target/${{ matrix.target }}/release/joob-client dist/joob-client-${{ matrix.suffix }}
          chmod +x dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.suffix }}
          path: dist/

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build joob-client (Windows)
        run: cargo build --release -p joob-client

      - name: Build joob-gui (Windows)
        run: cargo build --release -p joob-gui

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/joob-client.exe dist/joob-cli-windows-amd64.exe
          cp target/release/joob.exe dist/joob-gui-windows-amd64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: dist/

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/joob-server-linux-amd64
            dist/joob-server-linux-arm64
            dist/joob-client-linux-amd64
            dist/joob-client-linux-arm64
            dist/joob-cli-windows-amd64.exe
            dist/joob-gui-windows-amd64.exe
            dist/SHA256SUMS
