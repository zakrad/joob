[package]
name = "joob-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
joob-core = { path = "../joob-core" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"
base64 = "0.22"
anyhow = "1"
